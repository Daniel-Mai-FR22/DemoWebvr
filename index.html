<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TP04 Daniel</title>
    <meta name="description" content="TP04 Daniel" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.5.1/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@master/dist/aframe-physics-system.min.js"></script>
  </head>
  <body>
    <a-scene shadow="type: pcfsoft" physics="gravity: -9.8" renderer="antialias: true;"> //anticrénelage
      
      <!-- Load gun model -->
      <a-assets>
          <a-asset-item id="gun-model" src="https://cdn.glitch.global/def2864b-799b-4cf8-b06f-87febcb6ebe5/P-Cherie_Pinker.glb?v=1728658805727"></a-asset-item>
      </a-assets>
      
      <!-- Sky -->
      <a-sky color="#ECECEC"></a-sky>
      <!-- Ground -->
      <a-plane static-body rotation="-90 0 0" width="100" height="100" color="#7BC8A4" shadow="receive: true;"></a-plane>
      
      <!-- Directional Light -->
       <a-entity light="type: directional; castShadow: true; intensity: 1;" position="-5 3 -1.5"></a-entity>
      <!-- Ambient Light -->
      <a-entity light="type: ambient; intensity: 0.25;"></a-entity>
      
      <!-- Player -->
      <a-entity id="rig" position="0 0 0" movement-controls="speed: 0.1">
          <!-- Camera -->
          <a-entity camera position="0 1.6 0" look-controls></a-entity>
          <!-- Left controller -->
          <a-entity
            id="leftController"
            static-body="shape: sphere; sphereRadius: 0.02;"
            oculus-touch-controls="hand: left; model: true"
            sphere-collider="objects: .grabbable"
            grabbygrip
          ></a-entity>
          <!-- Right controller -->
          <a-entity
            id="rightController"
            static-body="shape: sphere; sphereRadius: 0.02;"
            oculus-touch-controls="hand: right; model: true"
            sphere-collider="objects: .grabbable"
            grabbygrip
            gun-shoot>
                  <a-entity id="fakegun" gltf-model="#gun-model" scale="0.02 0.02 0.02" position="0 0 0" rotation="45 0 0"
                  shadow="cast: true; receive: true;"
                  visible="false"
                  ></a-entity>
                  <!-- <a-sphere position="0 -0.2 -0.2" color="red" radius="0.05"></a-sphere> -->
                  <a-entity id="spawnBulletPosition" position="0 -0.2 -0.2"></a-entity>
        </a-entity>
      </a-entity>
      
      <!-- dynamic-body -->
      <a-box
        class="grabbable"
        dynamic-body
        position="0 0.5 -0.5" scale="0.2 0.2 0.2" color="green"
        shadow="cast: true; receive: true;"
      ></a-box>
      <a-box
        class="grabbable"
        dynamic-body
        position="0.5 0.5 -0.5" scale="0.2 0.2 0.2" color="green"
        shadow="cast: true; receive: true;"
      ></a-box>
      <a-sphere
        class="grabbable"
        dynamic-body
        position="-0.5 0.5 -0.5" radius="0.2" color="green"
        shadow="cast: true; receive: true;"
      ></a-sphere>
      
      
      <a-entity id="gun" gltf-model="#gun-model" scale="0.02 0.02 0.02" position="0 1 -1" rotation="0 0 0"
        class="grabbable"
        dynamic-body
        shadow="cast: true; receive: true;"
      ></a-entity>
      
      <!-- Create floating cubes (yellow) -->
      <a-box
        class="floating-cube"
        dynamic-body="mass: 0"
        position="1 2 -3" scale="0.5 0.5 0.5" color="yellow"
        shadow="cast: true; receive: true;"
      ></a-box>
      <a-box
        class="floating-cube"
        dynamic-body="mass: 0"
        position="-1 2 -4" scale="0.5 0.5 0.5" color="yellow"
        shadow="cast: true; receive: true;"
      ></a-box>
      <a-box
        class="floating-cube"
        dynamic-body="mass: 0"
        position="2 2 -5" scale="0.5 0.5 0.5" color="yellow"
        shadow="cast: true; receive: true;"
      ></a-box>
    </a-scene>
  </body>
</html>

<script>
  var isGunInHand = false; // To check if the gun is being held
  /* global CANNON */

/**
 * Based on aframe/examples/showcase/tracked-controls.
 *
 * Handles events coming from the hand-controls.
 * Determines if the entity is grabbed or released.
 * Updates its position to move along the controller.
 */
  
  /* Modifié pour saisir uniquement avec le bouton grip. */
AFRAME.registerComponent('grabbygrip', {
  init: function () {
    this.system = this.el.sceneEl.systems.physics;

    this.GRABBED_STATE = 'grabbed';

    this.grabbing = false;
    this.hitEl =      /** @type {AFRAME.Element}    */ null;
    this.physics =    /** @type {AFRAME.System}     */ this.el.sceneEl.systems.physics;
    this.constraint = /** @type {CANNON.Constraint} */ null;

    // Bind event handlers
    this.onHit = this.onHit.bind(this);
    this.onGripOpen = this.onGripOpen.bind(this);
    this.onGripClose = this.onGripClose.bind(this);
  },

  play: function () {
    const el = this.el;
    el.addEventListener('hit', this.onHit);
    el.addEventListener('gripdown', this.onGripClose);
    el.addEventListener('gripup', this.onGripOpen);
  },

  pause: function () {
    const el = this.el;
    el.removeEventListener('hit', this.onHit);
    el.removeEventListener('gripdown', this.onGripClose);
    el.removeEventListener('gripup', this.onGripOpen);
  },

  onGripClose: function () {
    this.grabbing = true;
  },

  onGripOpen: function () {
    const hitEl = this.hitEl;
    this.grabbing = false;
    if (!hitEl) { return; }
    hitEl.removeState(this.GRABBED_STATE);
    this.hitEl = undefined;
    this.system.removeConstraint(this.constraint);
    this.constraint = null;
    
    if (this.el.id === 'rightController'){
        // If gun is released, show gun again and hide fakegun
        const gun = document.getElementById('gun');
        const fakegun = document.getElementById('fakegun');
        gun.setAttribute('visible', true);  // Show gun again
        fakegun.setAttribute('visible', false);  // Hide fakegun
        isGunInHand = false;  // The gun is no longer in hand
    }
  },

  onHit: function (evt) {
    const hitEl = evt.detail.el;
    
    // If the element is already grabbed (it could be grabbed by another controller).
    // If the hand is not grabbing the element does not stick.
    // If we're already grabbing something you can't grab again.
    if (hitEl.is(this.GRABBED_STATE) || !this.grabbing || this.hitEl) { return; }
    hitEl.addState(this.GRABBED_STATE);
    this.hitEl = hitEl;
    
    this.constraint = new CANNON.LockConstraint(this.el.body, hitEl.body);
    this.system.addConstraint(this.constraint);
    if (this.el.id === 'rightController'){
        // If the object being held is a gun, hide the gun and show the fakegun
        if (hitEl.id === 'gun') {
            const gun = document.getElementById('gun');
            const fakegun = document.getElementById('fakegun');
            gun.setAttribute('visible', false);  // Hide gun
            fakegun.setAttribute('visible', true);  // Show fakegun
            isGunInHand = true;  // Marks the gun in hand
        }
    }
  }
});
  
AFRAME.registerComponent('gun-shoot', {
  init: function () {
    const el = this.el;
    const sceneEl = el.sceneEl;

    // Listen for triggerdown event from controller
    el.addEventListener('triggerdown', () => {
      if (isGunInHand) {  // Only shoot when gun is in hand
        this.shootBullet();
      }
    });
  },

  shootBullet: function () {
    // Get the position of `rightController` and `spawnBulletPosition`
    const rightController = document.getElementById('rightController');
    const spawnBulletPosition = document.getElementById('spawnBulletPosition');

    // Get the current position of spawnBulletPosition
    const spawnPos = new THREE.Vector3();
    spawnBulletPosition.object3D.getWorldPosition(spawnPos);
    
    // Get the current position of rightController
    const rightControllerPos = new THREE.Vector3();
    rightController.object3D.getWorldPosition(rightControllerPos);

    // Calculate direction from controller to spawnBulletPosition
    const direction = new THREE.Vector3();
    direction.subVectors(rightControllerPos, spawnPos).normalize();
    
    // Set the speed of the bullet in the calculated direction
    const velocity = direction.multiplyScalar(-20);  // Adjust rate of fire (-10 is variable)
    
    //Create bullet
    const bullet = document.createElement('a-sphere');
    bullet.setAttribute('radius', '0.05');
    bullet.setAttribute('color', 'red');
    bullet.setAttribute('dynamic-body', '');  // Apply physics to bullets
    bullet.setAttribute('position', spawnPos);
    bullet.setAttribute('velocity', `${velocity.x} ${velocity.y} ${velocity.z}`);
    
    // Add collision detection to bullet
    bullet.addEventListener('collide', function (e) {
      const hitObject = e.detail.body.el;
      if (hitObject.classList.contains('floating-cube')) {
          setTimeout(() => {
              // Remove the cube that the bullet collided with
              hitObject.parentNode.removeChild(hitObject);
              // Remove the bullet itself
              bullet.parentNode.removeChild(bullet);
          }, 0);  // Delay of 0ms still allows physics system to finish processing
      }
    });

    // Add bullet to scene
    const scene = document.querySelector('a-scene');
    scene.appendChild(bullet);

    // Delete the bullet after 3 seconds so it doesn't stay in the scene for too long
    setTimeout(() => {
      bullet.parentNode.removeChild(bullet);
    }, 3000);
  }
});

// Function to create floating gold cubes
function createFloatingCube() {
    const cube = document.createElement('a-box');
    cube.setAttribute('class', 'floating-cube');
    cube.setAttribute('dynamic-body', 'mass: 0');
    cube.setAttribute('color', 'yellow');
    cube.setAttribute('scale', '0.5 0.5 0.5');
    cube.setAttribute('position', `${Math.random() * 4 - 2} 2 ${Math.random() * -5 - 3}`); // Random position

    // Add animation
    cube.setAttribute('animation', 'property: position; to: 1 2.5 -3; dir: alternate; dur: 2000; loop: true');

    // Add cube to scene
    const scene = document.querySelector('a-scene');
    scene.appendChild(cube);
}

// Create new gold cube every 3 seconds
setInterval(() => {
  createFloatingCube();
}, 3000);  
  
</script>
